name: MacTorrent
options:
  developmentLanguage: de
  bundleIdPrefix: ch.stefan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

targets:
  TorrentKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TorrentKit
    settings:
      base:
        PRODUCT_MODULE_NAME: TorrentKit
        PRODUCT_BUNDLE_IDENTIFIER: ch.stefan.mactorrent.torrentkit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ENABLE_TESTABILITY: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  TorrentKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TorrentKitTests
        excludes:
          - Info.plist
    dependencies:
      - target: TorrentKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tests/TorrentKitTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ch.stefan.mactorrent.torrentkit.tests
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

  MacTorrent:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
    resources:
      - path: Resources/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: MacTorrent
        PRODUCT_BUNDLE_IDENTIFIER: ch.stefan.mactorrent
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MacTorrent.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - target: TorrentKit

schemes:
  MacTorrent:
    build:
      targets:
        MacTorrent: all
        TorrentKitTests: [test]
    run:
      config: Debug
    test:
      targets:
        - TorrentKitTests
  TorrentKit:
    build:
      targets:
        TorrentKit: all
    test:
      targets:
        - TorrentKitTests
